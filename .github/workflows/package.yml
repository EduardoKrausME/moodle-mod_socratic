name: Package Moodle plugin

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create Moodle ZIP
        run: |
          git archive --format=zip --prefix=socratic/ -o mod_socratic.zip HEAD
          unzip -Z1 mod_socratic.zip | grep -q '^socratic/version.php$'
          if unzip -Z1 mod_socratic.zip | grep -v '^socratic/'; then
            echo "Unexpected entry outside socratic/ root"
            exit 1
          fi
      - name: Upload installable ZIP (no release)
        uses: actions/upload-artifact@v4
        with:
          name: mod_socratic-installable
          path: mod_socratic.zip
